[project]
name = "gn-module-monitoring-flora-station"
description = "GeoNature module for monitoring flora on a station."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["monitoring", "flore", "station", "taxon"]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
maintainers = [
    {name = "Conservatoire Botanique National Alpin", email = "geonature@cbn-alpin.fr"},
]
authors = [
    {name = "Estelle"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
urls.homepage = "https://github.com/cbn-alpin/gn_module_monitoring_flora_station"
urls.documentation = "https://github.com/cbn-alpin/gn_module_monitoring_flora_station"
urls.repository = "https://github.com/cbn-alpin/gn_module_monitoring_flora_station"
dynamic = ["version"]
dependencies = [
    "pypnnomenclature",
    "pypnusershub>=1.5.9",
    "geonature>=2.13",
    "gn_conservation_backend_shared>=0.5.2"
]

[project.optional-dependencies]
dev = [
    "black",
]

[project.entry-points.gn_module]
code = "gn_module_monitoring_flora_station:MODULE_CODE"
picto = "gn_module_monitoring_flora_station:MODULE_PICTO"
blueprint = "gn_module_monitoring_flora_station.blueprint:blueprint"
config_schema = "gn_module_monitoring_flora_station.conf_schema_toml:GnModuleSchemaConf"
migrations = "gn_module_monitoring_flora_station:migrations"
alembic_branch = "gn_module_monitoring_flora_station:MODULE_DB_BRANCH"

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["gn_module_monitoring_flora_station*"]
namespaces = true

[tool.setuptools.package-data]
"gn_module_monitoring_flora_station.migrations.data" = ["*.sql"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "backend",
]

[tool.black]
line-length = 100