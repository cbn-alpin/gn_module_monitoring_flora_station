# Exports available formats
export_available_format = ['geojson', 'csv', 'shapefile']

# Code used as prefix to create monitoring sites code
site_type_code = "FLO"
# Code of users list (utilisateurs.t_listes)
user_list_code = "OFS"
# Code of municipalities list (ref_geo.bib_areas_types)
municipality_type_code = "COM"
# Name of taxon list (taxonomie.bib_listes.nom_liste)
taxon_list_name = "Suivi Flore Station"
# Max depth for monitoring plots creation
max_plot_depth = 2

# Map view default position
zoom_center = [44.863664, 6.268670]
# Map view default zoom level
