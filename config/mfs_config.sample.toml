    { "name" = "Taxon", "prop" = "nom_taxon", "width" = "350"},
    { "name" = "Nombre de visites", "prop" = "nb_visit", "width" = "120"},
    { "name" = "Date de la dernière visite", "prop" = "date_max", "width" = "160"}
]
